@if (layout.nodes.length) {
<svg class="diagram" [class.compact]="compact" [class.fixed]="scale != null" [attr.viewBox]="'0 0 ' + layout.width + ' ' + layout.height"
  [attr.width]="renderWidth" [attr.height]="renderHeight" preserveAspectRatio="xMinYMin meet" role="img">
  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"></path>
    </marker>
    <marker id="wf-arrow-taken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head taken"></path>
    </marker>
  </defs>
  @for (e of layout.edges; track trackEdge($index, e)) {
    <path class="edge" [class.taken]="isTaken(e)" [attr.d]="e.path"
      [attr.marker-end]="isTaken(e) ? 'url(#wf-arrow-taken)' : 'url(#wf-arrow)'"></path>
    <text class="edge-label" [class.taken]="isTaken(e)" [attr.x]="e.lx" [attr.y]="e.ly" text-anchor="middle">{{ short(e.transition.label, 18) }}</text>
  }
  @for (n of layout.nodes; track trackNode($index, n)) {
    <g class="node" [class.current]="n.state.key === currentStateKey" [class.selected]="n.state.key === selectedStateKey"
      [class.end]="n.state.kind === 'END'" [class.start]="n.state.kind === 'START'"
      (click)="stateClick.emit(n.state.key)" tabindex="0" (keydown.enter)="stateClick.emit(n.state.key)">
      <title>{{ title(n.state) }}</title>
      @if (isReview(n)) {
        <!-- parallel review: two cards peeking out behind the status, one per extra reviewer -->
        <rect class="stack" [attr.x]="n.x + 8" [attr.y]="n.y - 8" [attr.width]="n.w" [attr.height]="n.h" rx="8" [attr.fill]="fill(n)" opacity=".35"></rect>
        <rect class="stack" [attr.x]="n.x + 4" [attr.y]="n.y - 4" [attr.width]="n.w" [attr.height]="n.h" rx="8" [attr.fill]="fill(n)" opacity=".6"></rect>
      }
      <rect [attr.x]="n.x" [attr.y]="n.y" [attr.width]="n.w" [attr.height]="n.h" [attr.rx]="n.state.kind === 'END' ? n.h / 2 : 8"
        [attr.fill]="fill(n)"></rect>
      @if (n.state.kind === 'START') {
        <circle [attr.cx]="n.x + 14" [attr.cy]="n.y + n.h / 2" r="4" [attr.fill]="text(n)"></circle>
      }
      <text [attr.x]="n.x + n.w / 2 + (n.state.kind === 'START' ? 6 : 0)" [attr.y]="n.y + n.h / 2 + 4" text-anchor="middle"
        [attr.fill]="text(n)">{{ short(n.state.label) }}</text>
      @if (isReview(n)) {
        <g class="review-badge" [attr.transform]="'translate(' + (n.x + n.w - 2) + ' ' + (n.y + 2) + ')'">
          <circle r="9" [attr.stroke]="fill(n)"></circle>
          <!-- Material "group" icon, 24px box scaled to 12px -->
          <path transform="translate(-6 -6) scale(.5)" [attr.fill]="fill(n)"
            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
        </g>
      }
    </g>
  }
</svg>
}
