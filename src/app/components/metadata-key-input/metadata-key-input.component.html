<input #field type="text" class="meta-input" autocomplete="off"
  role="combobox" aria-autocomplete="list"
  [attr.aria-expanded]="open"
  [attr.aria-controls]="open ? listId : null"
  [attr.aria-activedescendant]="open && activeIndex >= 0 ? optionId(activeIndex) : null"
  [attr.aria-label]="ariaLabel()"
  [placeholder]="placeholder()"
  [ngModel]="value()"
  (ngModelChange)="onInput($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (keydown)="onKeydown($event)" />
@if (open) {
  <ul #list class="key-list" role="listbox" [id]="listId" [attr.aria-label]="'searchFilters.keySuggestions' | translate">
    @for (option of options; track option.key; let i = $index) {
      <li role="option" class="key-option" [id]="optionId(i)"
        [class.active]="i === activeIndex"
        [attr.aria-selected]="i === activeIndex"
        (mousedown)="$event.preventDefault()"
        (click)="$event.stopPropagation(); pick(option)">
        <span class="key-name">{{ option.key }}</span>
        <span class="key-count" [attr.aria-label]="'searchFilters.keyDocumentCount' | translate: { count: option.count }">{{ option.count }}</span>
      </li>
    }
  </ul>
}
