<div class="dialog-header">
  <div class="header-content">
    <div class="icon-wrapper">
      <mat-icon>warning</mat-icon>
    </div>
    <div class="header-text">
      <h2 class="dialog-title">{{ 'confirmReplace.title' | translate }}</h2>
      <p class="dialog-subtitle">{{ 'confirmReplace.subtitle' | translate }}</p>
    </div>
  </div>
</div>

<mat-dialog-content class="dialog-content">
  <p>
    {{ 'confirmReplace.message' | translate: { name: data.fileName } }}
  </p>
  <p>
    {{ 'confirmReplace.question' | translate }}
  </p>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-stroked-button class="cancel-btn" (click)="onCancel()">
    <mat-icon>close</mat-icon>
    {{ 'confirmReplace.cancel' | translate }}
  </button>
  <button mat-flat-button class="replace-btn" (click)="onReplace()">
    <mat-icon>swap_horiz</mat-icon>
    {{ 'confirmReplace.replace' | translate }}
  </button>
</mat-dialog-actions>
