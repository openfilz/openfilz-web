server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  # Redirect all routes to index.html for Angular's client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
  # i18n JSON files — never cache (small files, change on redeploy)
  location /i18n/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }
  # Runtime Angular config — regenerated on each deploy from NG_APP_* env, never cache.
  # Exact-match location outranks the regex cache rule below.
  location = /ngx-env.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }
  # ES modules (the pdf.js worker ships as .mjs). nginx's bundled mime.types has no entry
  # for .mjs, so it would be served as application/octet-stream — Chrome then refuses to run
  # it both as a module worker and via dynamic import, pdf.js falls back to "Setting up fake
  # worker" and every PDF preview fails. The empty `types {}` clears the inherited map for
  # this location only, so default_type applies; a server-level `types` block would replace
  # the whole map and break every other content type.
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }
  # Configure caching for static assets (hashed filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }
}