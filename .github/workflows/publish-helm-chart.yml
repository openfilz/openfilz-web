# Manual (re-)publish of the openfilz-web Helm chart at a given version,
# WITHOUT running a release. Use cases:
#   - bootstrap: publish the chart once for an ALREADY-released image version
#     (e.g. 1.2.11) so consumers (the openfilz-ce umbrella in openfilz-core)
#     can resolve the OCI dependency before the next web release;
#   - re-publish after a failed/partial release, or on ghcr tag-index drift.
# The normal path is automatic: build-ui.yml packages+pushes the chart on
# every release. First publish creates a PRIVATE ghcr package — flip
# charts/openfilz-web to public once in the ghcr UI.
name: Publish Helm chart (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version + appVersion — MUST be an existing openfilz-web image tag (e.g. 1.2.11)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm lint deploy/helm/openfilz-web
          helm package deploy/helm/openfilz-web \
            --version "$VERSION" --app-version "$VERSION" -d target/charts-dist
          helm push "target/charts-dist/openfilz-web-$VERSION.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts
          echo "Published oci://ghcr.io/${{ github.repository_owner }}/charts/openfilz-web:$VERSION"
